name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kiểm catalog, CATALOG.md, secret, phiên bản
        run: python3 scripts/ci_check.py --base "origin/${{ github.base_ref || 'main' }}"
